<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <title>Greenhouse Sensor Dashboard</title>
  </head>
  <body>
    <header class="portal-header">
      <div class="header-content">
        <span class="header-logo"> &#127893; </span>
        <h1 class="header-title">GREENHOUSE</h1>
      </div>
      <div class="header-status">
        Active Queue: <span id="active-queue" class="badge-count">0</span>
      </div>
    </header>

    <main class="portal-container">
      <section class="panel records-panel">
        <div class="records-header">
          <h2 class="panel-title">Current Queue</h2>
          <button id="btn-clear-all" class="btn btn-outline-danger btn-sm">
            Clear Queue
          </button>
        </div>
        <div id="empty-state" class="empty-state">
          <span class="empty-state-icon"> &#128393;</span>
          <p>No records in the queue.</p>
        </div>
        <ul id="records-list" class="records-list" aria-live="polite"></ul>
      </section>

      <aside class="panel form-panel">
        <h2 class="panel-title">Add New Record</h2>
        <div
          class="alert alert-danger hidden"
          id="form-error"
          role="alert"
        ></div>
        <form action="#" id="input-form" novalidate>
          <div class="form-group">
            <label for="pH" class="form-label">pH Level</label>
            <input
              type="number"
              id="pH"
              class="form-control"
              placeholder="Enter pH level"
              step="0.1"
              min="0"
              max="14"
              required
            />

            <label for="ec" class="form-label"
              >Electrical Conductivity mS/cm</label
            >
            <input
              type="number"
              id="ec"
              class="form-control"
              placeholder="Enter electrical conductivity"
              step="0.1"
              min="0"
              required
            />
            <label for="temp" class="form-label">Temperature °F</label>
            <input
              type="number"
              id="temp"
              class="form-control"
              placeholder="Enter air temperature"
              step="0.1"
              required
            />
            <label for="rh" class="form-label">Humidity %</label>
            <input
              type="number"
              id="rh"
              class="form-control"
              placeholder="Enter relative humidity"
              step="0.1"
              min="0"
              max="100"
              required
            />
          </div>
          <button
            type="submit"
            id="btn-submit"
            class="btn btn-primary btn-block"
          >
            Submit Entry
          </button>
        </form>
      </aside>
    </main>

    <footer class="portal-footer">
      <p>&copy; 2026 GreenHouse Project 2 CSI 3150</p>
    </footer>
  </body>
</html>
